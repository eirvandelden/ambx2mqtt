# Copy this to ~/.config/ambx2mqtt/config.yml and fill in your own broker.
#
# The password is never written here. Put an op:// reference instead and the
# daemon reads it from 1Password at startup with the `op` command, so unlock
# 1Password before the daemon starts. A plain password also works if you would
# rather not use 1Password.

broker:
  host: mqtt.home.arpa
  port: 1883
  username: ambx2mqtt
  password: op://Familie/MqttBroker/password

# Where the daemon remembers what each lamp was last asked for. Leave this out
# and it lives under your own state directory.
state_file: ~/.local/state/ambx2mqtt/state.json

# How much the daemon says for itself: debug, info, warn or error.
log_level: info

# Optional. Give a set a name a person would recognise. The key is the set's
# identity, which the daemon logs when it finds one: serial_ and the box's
# serial number, or port_ and where it is plugged in when it has no serial.
# A set left out here is called by its identity.
#
# A set with no serial is known by where it is plugged in, so moving it to a
# different socket gives it a new identity and it needs naming again.
sets:
  serial_AB12CD34: Living room
  port_1_2_3: Study
